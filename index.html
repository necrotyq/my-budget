<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Budget App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- CSS --- */
        :root { --primary: #6c5ce7; --bg-start: #667eea; --bg-end: #764ba2; --text-font: 'Poppins', sans-serif; --card-bg: #ffffff; --text-color: #2d3436; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--text-font); background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%); margin: 0; padding: 20px; color: var(--text-color); min-height: 100vh; padding-bottom: 100px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 20px; }
        .settings-btn { background: rgba(255,255,255,0.25); border: none; color: white; font-size: 1.5rem; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* PANNEAUX (Settings & History) */
        #settings-panel, #history-panel { display: none; background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); position: relative; z-index: 50; max-height: 80vh; overflow-y: auto; }
        
        .setting-row { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .setting-row label { display: block; margin-bottom: 5px; color: #555; font-weight: 600; }
        input[type="color"], select { width: 100%; height: 45px; border: 1px solid #ddd; border-radius: 10px; padding: 5px 10px; cursor: pointer; background: white; font-size: 1rem; }
        h3 { margin-top: 0; color: #333; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }

        /* BOUTONS MENU */
        .btn-menu { width: 100%; padding: 12px; border-radius: 10px; margin-top: 10px; font-size: 0.95rem; cursor: pointer; border: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-new-month { background-color: #00b894; }
        .btn-history { background-color: #6c5ce7; }
        .btn-backup { background-color: #0984e3; }
        .btn-pdf { background-color: #636e72; }
        .btn-share { background-color: #e84393; }
        .btn-reset { background-color: #dfe6e9; color: #636e72; box-shadow: none; }
        .btn-close { background-color: var(--primary); margin-top: 20px; }

        /* CARTES */
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        
        .dynamic-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .input-category { width: 45px; flex-shrink: 0; padding: 0; height: 45px; border: 2px solid #f1f2f6; border-radius: 10px; background: #f8f9fa; font-size: 1.4rem; cursor: pointer; text-align: center; appearance: none; -webkit-appearance: none; }
        input.input-text { width: 100%; padding: 12px; border: 2px solid #f1f2f6; background-color: #f8f9fa; border-radius: 10px; font-size: 0.95rem; box-sizing: border-box; font-family: var(--text-font); }
        .input-nom { flex: 2; }
        .price-wrapper { flex: 1; display: flex; align-items: center; background-color: #f8f9fa; border: 2px solid #f1f2f6; border-radius: 10px; padding-right: 10px; }
        .input-prix { width: 100%; border: none; background: transparent; padding: 12px 5px 12px 12px; font-size: 0.95rem; font-weight: bold; color: var(--primary); font-family: var(--text-font); outline: none; }
        .currency-symbol { color: #b2bec3; font-weight: bold; font-size: 0.9rem; }

        .action-btn { width: 40px; height: 45px; border-radius: 10px; border: none; cursor: pointer; font-size: 1.1rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .btn-delete { background: rgba(255, 118, 117, 0.15); color: #ff7675; }
        .btn-lock { background: #f1f2f6; filter: grayscale(100%); opacity: 0.5; }
        .btn-lock.locked { background: #ffeaa7; filter: grayscale(0%); opacity: 1; border: 1px solid #fdcb6e; }
        .btn-add { width: 100%; background: transparent; border: 2px dashed #b2bec3; color: #636e72; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 5px; }
        .btn-calcul { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; font-size: 1.2rem; border-radius: 15px; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.2); font-weight: bold; letter-spacing: 1px; margin-top: 10px; margin-bottom: 30px; }

        /* RESULTATS */
        #resultat, #resultat-groupe { display: none; text-align: center; background: #2d3436; color: white; padding: 30px; border-radius: 20px; margin-top: 20px; }
        .big-number { font-size: 2.2rem; font-weight: bold; margin: 10px 0; }
        .details { font-size: 0.9rem; opacity: 0.8; margin-top: 10px; }
        .chart-container { margin-top: 20px; background: white; padding: 15px; border-radius: 15px; display: none; } /* Caché par défaut */

        /* HISTORIQUE */
        .history-item { border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: center; }
        .history-info h4 { margin: 0 0 5px 0; font-size: 1rem; color: #2d3436; }
        .history-info p { margin: 0; font-size: 0.8rem; color: #636e72; }
        .history-actions { display: flex; align-items: center; gap: 5px; }
        .history-balance { font-weight: bold; font-size: 0.95rem; margin-right: 5px; }
        .btn-icon-hist { background: white; border: 1px solid #ddd; cursor: pointer; font-size: 1rem; padding: 5px; border-radius: 8px; width:35px; height:35px; display:flex; align-items:center; justify-content:center; }
        .btn-del { color: #ff7675; border-color: #ff7675; }
        .btn-share-hist { color: #0984e3; border-color: #0984e3; }
        .btn-pdf-hist { color: #636e72; border-color: #636e72; }

        /* GOALS */
        .progress-container { width: 100%; background: #f1f2f6; border-radius: 15px; height: 30px; margin: 20px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8rem; }
        .goal-msg { text-align: center; font-weight: bold; color: var(--primary); margin-top: 15px; }

        /* PDF */
        #print-area { display: none; }
        @media print {
            body > *:not(#print-area) { display: none !important; }
            #print-area { display: block !important; position: absolute; top: 0; left: 0; width: 100%; padding: 20px; color: black; background: white; z-index: 9999; }
            .print-header { text-align: center; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 20px; }
            .print-section { margin-bottom: 30px; }
            .print-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #333; text-transform: uppercase; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
            .print-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dotted #eee; }
            .print-total-row { display: flex; justify-content: space-between; font-weight: bold; padding-top: 10px; border-top: 2px solid #333; margin-top: 10px; }
            .print-final { text-align: center; font-size: 1.5rem; font-weight: bold; margin-top: 40px; padding: 20px; border: 2px solid #333; border-radius: 10px; }
        }

        /* NAVIGATION BAS */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top-left-radius: 25px; border-top-right-radius: 25px; box-shadow: 0 -5px 30px rgba(0,0,0,0.1); z-index: 100; }
        .nav-item { border: none; background: none; font-family: var(--text-font); font-size: 0.8rem; color: #b2bec3; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 33%; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-icon { font-size: 1.5rem; }
        .page-content { display: none; }
        .page-content.active { display: block; animation: fadeIn 0.4s ease; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 id="header-title" style="margin:0; font-size:1.5rem;" data-i18n="appTitle">Mon Budget</h1>
            <small id="header-subtitle" data-i18n="appSubtitle">Gère tes finances</small>
        </div>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </header>

    <div id="settings-panel">
        <h3 data-i18n="settingsTitle">🎨 Personnalisation</h3>
        
        <div class="setting-row">
            <label data-i18n="langLabel">Langue</label>
            <select id="lang-select" onchange="updateLanguage()">
                <option value="fr">Français 🇫🇷</option>
                <option value="en">English 🇺🇸</option>
                <option value="es">Español 🇪🇸</option>
                <option value="de">Deutsch 🇩🇪</option>
                <option value="it">Italiano 🇮🇹</option>
            </select>
        </div>

        <div class="setting-row">
            <label data-i18n="currencyLabel">Devise</label>
            <select id="currency-select" onchange="updateCurrency()">
                <option value="€">Euro (€)</option>
                <option value="$">Dollar ($)</option>
                <option value="£">Pound (£)</option>
                <option value="CHF">Franc (CHF)</option>
                <option value="XAF">CFA (XAF)</option>
            </select>
        </div>

        <div class="setting-row"><label data-i18n="colorLabel">Couleur Principale</label><input type="color" id="color-primary" value="#6c5ce7" onchange="updateTheme()"></div>
        <div class="setting-row"><label data-i18n="bgLabel">Couleur de Fond</label><input type="color" id="color-bg" value="#667eea" onchange="updateTheme()"></div>
        
        <h3 data-i18n="manageTitle" style="margin-top:20px;">🗑️ Gestion</h3>
        <button class="btn-menu btn-history" onclick="openHistory()" data-i18n="btnHistory">📜 Historique / Archives</button>
        <button class="btn-menu btn-new-month" onclick="nouveauMois()" data-i18n="btnNewMonth">📅 Nouveau Mois</button>
        <button class="btn-menu btn-reset" style="background:#e17055; color:white;" onclick="clearGroup()" data-i18n="btnClearGroup">👥 Effacer Groupe</button>
        
        <h3 data-i18n="shareTitle" style="margin-top:20px;">📤 Export</h3>
        <button class="btn-menu btn-share" onclick="shareBudget()" data-i18n="btnShare">📧 Partager (Texte)</button>
        <button class="btn-menu btn-pdf" onclick="printCurrentBudget()" data-i18n="btnPdf">📄 Imprimer / PDF</button>
        <button class="btn-menu btn-backup" onclick="exportData()" data-i18n="btnExport">💾 Sauvegarde</button>
        <button class="btn-menu btn-backup" onclick="triggerImport()" style="background:#a29bfe" data-i18n="btnImport">⬆️ Restaurer</button>
        <input type="file" id="import-file" style="display:none" onchange="importData(this)">
        
        <hr style="margin:20px 0; border-top:1px solid #eee;">
        <button class="btn-menu btn-reset" onclick="resetSettingsOnly()" data-i18n="btnReset">🔄 Rétablir Param. d'usine</button>
        <button class="btn-menu btn-close" onclick="closePanels()" data-i18n="btnClose">Fermer</button>
    </div>

    <div id="history-panel">
        <h3 data-i18n="historyTitle">📜 Archives</h3>
        <div id="history-list"></div>
        <div id="no-history-msg" style="text-align:center; margin:20px; color:#999;">Aucune archive.</div>
        <button class="btn-menu btn-close" onclick="closePanels()" data-i18n="btnClose">Fermer</button>
    </div>

    <div id="page-monthly" class="page-content active">
        <div class="card">
            <h2 data-i18n="incomeTitle">💰 Revenus</h2>
            <div id="liste-revenus"></div>
            <button class="btn-add" onclick="ajouterLigne('revenus')" data-i18n="btnAddIncome">+ Revenu</button>
        </div>
        <div class="card">
            <h2 data-i18n="expenseTitle">📉 Dépenses</h2>
            <div id="liste-depenses"></div>
            <button class="btn-add" onclick="ajouterLigne('depenses')" data-i18n="btnAddExpense">+ Dépense</button>
        </div>
        <button class="btn-calcul" onclick="calculerBudget()" data-i18n="btnCalculate">CALCULER</button>
        <div id="resultat">
            <div data-i18n="resultText">Reste :</div>
            <div id="resteDisplay" class="big-number">0.00 €</div>
            <div id="detailsBlock" class="details"></div>
            <div id="graph-box" class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <div id="page-group" class="page-content">
        <div class="card">
            <h2 data-i18n="groupPeopleTitle">👥 Participants</h2>
            <label data-i18n="groupPeopleLabel">Nombre :</label>
            <div class="price-wrapper"><input type="number" id="group-count" class="input-text" style="text-align:center; font-weight:bold;" value="2" onchange="calculerGroupe()"></div>
        </div>
        <div class="card">
            <h2 data-i18n="groupExpenseTitle">🍕 Partage</h2>
            <div id="liste-groupe"></div>
            <button class="btn-add" onclick="ajouterLigne('groupe')" data-i18n="btnAddGroupExpense">+ Dépense</button>
        </div>
        <button class="btn-calcul" onclick="calculerGroupe()" data-i18n="btnCalculate">CALCULER</button>
        <div id="resultat-groupe">
            <div data-i18n="groupTotalText">Total :</div>
            <div id="groupTotalDisplay" class="big-number">0.00 €</div>
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.2); margin:15px 0;">
            <div data-i18n="groupPerPersonText">Par personne :</div>
            <div id="groupSplitDisplay" class="big-number" style="color:#00b894;">0.00 €</div>
        </div>
    </div>

    <div id="page-goal" class="page-content">
        <div class="card">
            <h2 data-i18n="goalTitle">🎯 Objectif</h2>
            <label data-i18n="goalName">Nom :</label><input type="text" id="goal-name" class="input-text" style="margin-bottom:10px" oninput="calculerObjectif()">
            <label data-i18n="goalTarget">Cible :</label><div class="price-wrapper" style="margin-bottom:10px"><input type="number" id="goal-target" class="input-prix" oninput="calculerObjectif()"><span class="currency-symbol">€</span></div>
            <label data-i18n="goalCurrent">Actuel :</label><div class="price-wrapper" style="margin-bottom:10px"><input type="number" id="goal-current" class="input-prix" oninput="calculerObjectif()"><span class="currency-symbol">€</span></div>
            <label data-i18n="goalMonthly">Ajout Mensuel :</label><div class="price-wrapper"><input type="number" id="goal-monthly" class="input-prix" oninput="calculerObjectif()"><span class="currency-symbol">€</span></div>
        </div>
        <div class="card" style="text-align:center;">
            <div class="progress-container"><div id="goal-bar" class="progress-bar">0%</div></div>
            <div id="goal-msg" class="goal-msg"></div>
            <div id="goal-time" class="time-remaining"></div>
        </div>
    </div>
</div>

<div id="print-area"></div>

<nav class="bottom-nav">
    <button class="nav-item active" id="nav-monthly" onclick="switchTab('monthly')"><span class="nav-icon">📅</span><span data-i18n="tabMonthly">Budget</span></button>
    <button class="nav-item" id="nav-group" onclick="switchTab('group')"><span class="nav-icon">👥</span><span data-i18n="tabGroup">Amis</span></button>
    <button class="nav-item" id="nav-goal" onclick="switchTab('goal')"><span class="nav-icon">🎯</span><span data-i18n="tabGoal">Objectif</span></button>
</nav>

    };

    const CATEGORIES = [
        { key: 'housing', icon: '🏠', color: '#0984e3' }, { key: 'food', icon: '🍔', color: '#e17055' },
        { key: 'transport', icon: '🚗', color: '#636e72' }, { key: 'shop', icon: '🛍️', color: '#fdcb6e' },
        { key: 'fun', icon: '🎉', color: '#e84393' }, { key: 'health', icon: '💊', color: '#d63031' },
        { key: 'bills', icon: '💡', color: '#00b894' }, { key: 'other', icon: '📦', color: '#6c5ce7' }
    ];

    let myChartInstance = null;
    let currentLang = 'fr';
    let currentCurrency = '€';
    let currentTab = 'monthly';

    window.onload = function() {
        const s = JSON.parse(localStorage.getItem('mySettings'));
        if(s) {
            currentLang = s.lang || 'fr';
            currentCurrency = s.currency || '€';
            document.documentElement.style.setProperty('--primary', s.primary);
            document.getElementById('lang-select').value = currentLang;
            document.getElementById('currency-select').value = currentCurrency;
            document.getElementById('color-primary').value = s.primary;
            document.getElementById('color-bg').value = s.bg;
        }
        applyTranslations();
        loadData('revenus');
        loadData('depenses');
        loadData('groupe');
        loadGoal();
        
        const people = localStorage.getItem('group_people');
        if(people) document.getElementById('group-count').value = people;
        updateCurrencySymbols();
    }

    // --- FONCTIONS ---
    function updateLanguage() {
        currentLang = document.getElementById('lang-select').value;
        saveSettings();
        applyTranslations();
        switchTab(currentTab);
        calculerBudget(); // update chart legend
    }

    function updateCurrency() {
        currentCurrency = document.getElementById('currency-select').value;
        saveSettings();
        updateCurrencySymbols();
        calculerBudget();
        calculerGroupe();
        calculerObjectif();
    }

    function updateCurrencySymbols() {
        document.querySelectorAll('.currency-symbol').forEach(el => el.innerText = currentCurrency);
    }

    function updateTheme() {
        const p = document.getElementById('color-primary').value;
        const b = document.getElementById('color-bg').value;
        document.documentElement.style.setProperty('--primary', p);
        document.documentElement.style.setProperty('--bg-start', b);
        saveSettings();
    }

    function saveSettings() {
        localStorage.setItem('mySettings', JSON.stringify({ primary: document.getElementById('color-primary').value, bg: document.getElementById('color-bg').value, lang: currentLang, currency: currentCurrency }));
    }

    function applyTranslations() {
        const t = TRANSLATIONS[currentLang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });
        document.querySelectorAll('.row-revenu .input-nom').forEach(el => el.placeholder = t.placeholderIncome);
        document.querySelectorAll('.row-depense .input-nom').forEach(el => el.placeholder = t.placeholderExpense);
    }

    function ajouterLigne(type, nomVal = "", prixVal = "", isLocked = false, catVal = "other") {
        const t = TRANSLATIONS[currentLang];
        let containerId = (type === 'revenus') ? 'liste-revenus' : (type === 'depenses' ? 'liste-depenses' : 'liste-groupe');
        const container = document.getElementById(containerId);
        
        const row = document.createElement('div');
        row.className = 'dynamic-row';
        if(type === 'groupe') row.classList.add('row-groupe');
        else if(type === 'revenus') row.classList.add('row-revenu');
        else row.classList.add('row-depense');

        if(type === 'depenses') {
            const select = document.createElement('select'); select.className = 'input-category';
            CATEGORIES.forEach(cat => { const opt = document.createElement('option'); opt.value = cat.key; opt.innerText = cat.icon; select.appendChild(opt); });
            select.value = catVal; row.appendChild(select);
        }

        const inputNom = document.createElement('input'); inputNom.type = 'text'; inputNom.className = 'input-text input-nom'; inputNom.value = nomVal; inputNom.placeholder = (type === 'revenus') ? t.placeholderIncome : t.placeholderExpense;
        const priceWrapper = document.createElement('div'); priceWrapper.className = 'price-wrapper';
        const inputPrix = document.createElement('input'); inputPrix.type = 'number'; inputPrix.className = 'input-prix'; inputPrix.value = prixVal; inputPrix.placeholder = "0";
        const symbol = document.createElement('span'); symbol.className = 'currency-symbol'; symbol.innerText = currentCurrency;
        priceWrapper.appendChild(inputPrix); priceWrapper.appendChild(symbol);

        const btnLock = document.createElement('button'); btnLock.className = 'action-btn btn-lock';
        if(type === 'groupe') btnLock.style.visibility = 'hidden';
        else {
            if(isLocked) { btnLock.innerHTML = '🔒'; btnLock.classList.add('locked'); btnLock.dataset.locked = "true"; }
            else { btnLock.innerHTML = '🔓'; btnLock.dataset.locked = "false"; }
            btnLock.onclick = function() { if(btnLock.dataset.locked === "true") { btnLock.dataset.locked = "false"; btnLock.innerHTML = '🔓'; btnLock.classList.remove('locked'); } else { btnLock.dataset.locked = "true"; btnLock.innerHTML = '🔒'; btnLock.classList.add('locked'); } }
        }

        const btnDel = document.createElement('button'); btnDel.className = 'action-btn btn-delete'; btnDel.innerHTML = '✕'; btnDel.onclick = function() { row.remove(); };

        row.appendChild(inputNom); row.appendChild(priceWrapper); row.appendChild(btnLock); row.appendChild(btnDel);
        container.appendChild(row);
    }

    function calculerBudget() {
        let totalRev = 0, totalDep = 0; let saveRev = [], saveDep = []; let catTotals = {};
        CATEGORIES.forEach(c => catTotals[c.key] = 0);

        document.querySelectorAll('.row-revenu').forEach(row => {
            const nom = row.querySelector('.input-nom').value; const prix = parseFloat(row.querySelector('.input-prix').value) || 0; const locked = row.querySelector('.btn-lock').dataset.locked === "true";
            totalRev += prix; saveRev.push({nom, prix, locked});
        });

        document.querySelectorAll('.row-depense').forEach(row => {
            const cat = row.querySelector('.input-category') ? row.querySelector('.input-category').value : 'other';
            const nom = row.querySelector('.input-nom').value; const prix = parseFloat(row.querySelector('.input-prix').value) || 0; const locked = row.querySelector('.btn-lock').dataset.locked === "true";
            totalDep += prix; if (catTotals[cat] !== undefined) catTotals[cat] += prix; saveDep.push({nom, prix, locked, cat});
        });

        localStorage.setItem('data_revenus', JSON.stringify(saveRev));
        localStorage.setItem('data_depenses', JSON.stringify(saveDep));

        const reste = totalRev - totalDep;
        const t = TRANSLATIONS[currentLang];
        
        document.getElementById('resultat').style.display = 'block';
        const display = document.getElementById('resteDisplay');
        display.innerText = reste.toFixed(2) + " " + currentCurrency;
        display.style.color = reste >= 0 ? '#00b894' : '#ff7675';
        
        document.getElementById('detailsBlock').innerHTML = `${t.totalIncome}: ${totalRev.toFixed(2)} ${currentCurrency}<br>${t.totalExpense}: ${totalDep.toFixed(2)} ${currentCurrency}`;
        
        let labels = [], data = [], colors = [];
        CATEGORIES.forEach(c => {
            if(catTotals[c.key] > 0) {
                const trName = t['cat' + c.key.charAt(0).toUpperCase() + c.key.slice(1)] || c.key;
                labels.push(c.icon + " " + trName); data.push(catTotals[c.key]); colors.push(c.color);
            }
        });
        updateChart(labels, data, colors);
        return { totalRev, totalDep, reste, saveRev, saveDep };
    }

    function calculerGroupe() {
        let total = 0, save = [];
        document.querySelectorAll('.row-groupe').forEach(row => {
            const nom = row.querySelector('.input-nom').value; const prix = parseFloat(row.querySelector('.input-prix').value) || 0;
            total += prix; save.push({nom, prix});
        });
        const count = parseFloat(document.getElementById('group-count').value) || 1;
        localStorage.setItem('data_groupe', JSON.stringify(save)); localStorage.setItem('group_people', count);
        document.getElementById('resultat-groupe').style.display = 'block';
        document.getElementById('groupTotalDisplay').innerText = total.toFixed(2) + " " + currentCurrency;
        document.getElementById('groupSplitDisplay').innerText = (total / count).toFixed(2) + " " + currentCurrency;
    }

    function calculerObjectif() {
        const name = document.getElementById('goal-name').value; const target = parseFloat(document.getElementById('goal-target').value) || 0; const current = parseFloat(document.getElementById('goal-current').value) || 0; const monthly = parseFloat(document.getElementById('goal-monthly').value) || 0;
        localStorage.setItem('data_goal', JSON.stringify({name, target, current, monthly}));
        const bar = document.getElementById('goal-bar'); const t = TRANSLATIONS[currentLang];
        if(target <= 0) { bar.style.width="0%"; bar.innerText="0%"; return; }
        let pct = (current / target) * 100; if(pct > 100) pct = 100;
        bar.style.width = pct + "%"; bar.innerText = pct.toFixed(0) + "%";
        let msg = t.msgStart; if(pct >= 100) msg = t.msgDone; else if(pct >= 80) msg = t.msgAlmost; else if(pct >= 50) msg = t.msgHalf;
        document.getElementById('goal-msg').innerText = msg;
        if(monthly > 0 && pct < 100) { const months = (target - current) / monthly; document.getElementById('goal-time').innerText = `~ ${Math.ceil(months)} ${t.timeMonth}`; } 
        else { document.getElementById('goal-time').innerText = ""; }
    }

    function updateChart(labels, data, colors) {
        const box = document.querySelector('.chart-container');
        if(data.length === 0) { box.style.display = 'none'; return; }
        box.style.display = 'block';
        const ctx = document.getElementById('myChart').getContext('2d');
        if(myChartInstance) myChartInstance.destroy();
        myChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 0 }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: function(context) { return context.label + ': ' + context.parsed.toFixed(2) + ' ' + currentCurrency; } } } } }
        });
    }

    function loadData(type) {
        const data = JSON.parse(localStorage.getItem('data_' + type)) || [];
        if(data.length === 0) ajouterLigne(type); else data.forEach(item => ajouterLigne(type, item.nom, item.prix, item.locked, item.cat || 'other'));
    }
    
    function loadGoal() {
        const d = JSON.parse(localStorage.getItem('data_goal'));
        if(d) { document.getElementById('goal-name').value = d.name; document.getElementById('goal-target').value = d.target; document.getElementById('goal-current').value = d.current; document.getElementById('goal-monthly').value = d.monthly; calculerObjectif(); }
    }

    // --- PDF GENERATION ---
    function generatePrintHTML(title, incomeList, expenseList, totalInc, totalExp, balance, currency) {
        const t = TRANSLATIONS[currentLang];
        let html = `
            <div class="print-header"><h1>${t.appTitle} - ${t.reportTitle}</h1><h3>${title}</h3><p>Date: ${new Date().toLocaleDateString()}</p></div>
            <div class="print-section"><div class="print-title">${t.incomeTitle}</div>`;
        if(incomeList && incomeList.length > 0) { incomeList.forEach(r => { html += `<div class="print-row"><span>${r.nom || t.placeholderIncome}</span><span>${parseFloat(r.prix).toFixed(2)} ${currency}</span></div>`; }); }
        html += `<div class="print-total-row"><span>Total</span><span>${totalInc.toFixed(2)} ${currency}</span></div></div><div class="print-section"><div class="print-title">${t.expenseTitle}</div>`;
        if(expenseList && expenseList.length > 0) { expenseList.forEach(d => { let icon = '📦'; const foundCat = CATEGORIES.find(c => c.key === d.cat); if(foundCat) icon = foundCat.icon; html += `<div class="print-row"><span>${icon} ${d.nom || t.placeholderExpense}</span><span>${parseFloat(d.prix).toFixed(2)} ${currency}</span></div>`; }); }
        html += `<div class="print-total-row"><span>Total</span><span>${totalExp.toFixed(2)} ${currency}</span></div></div><div class="print-final">${t.resultText} ${balance.toFixed(2)} ${currency}</div>`;
        return html;
    }

    function printCurrentBudget() {
        const stats = calculerBudget(); 
        const html = generatePrintHTML("Budget Actuel", stats.saveRev, stats.saveDep, stats.totalRev, stats.totalDep, stats.reste, currentCurrency);
        document.getElementById('print-area').innerHTML = html;
        closePanels();
        setTimeout(() => { window.print(); }, 200);
    }

    function printHistoryItem(index) {
        const history = JSON.parse(localStorage.getItem('budget_history'));
        const item = history[index];
        const html = generatePrintHTML(item.name, item.detailsRevenus, item.detailsDepenses, parseFloat(item.income), parseFloat(item.expense), parseFloat(item.balance), item.currency);
        document.getElementById('print-area').innerHTML = html;
        window.print();
    }

    // --- OTHER FUNCS ---
    function nouveauMois() {
        const t = TRANSLATIONS[currentLang];
        if(confirm(t.archivePrompt)) {
            const name = prompt(t.archiveNamePrompt);
            if(name) {
                const stats = calculerBudget();
                const history = JSON.parse(localStorage.getItem('budget_history') || '[]');
                history.push({id: Date.now(), name: name, income: stats.totalRev, expense: stats.totalDep, balance: stats.reste, currency: currentCurrency, detailsRevenus: stats.saveRev, detailsDepenses: stats.saveDep});
                localStorage.setItem('budget_history', JSON.stringify(history)); alert("Archivé !");
            }
        }
        document.querySelectorAll('.row-depense .btn-lock').forEach(b => { if(b.dataset.locked === "false") b.parentElement.remove(); });
        calculerBudget(); closePanels();
    }

    function shareBudget() {
        const t = TRANSLATIONS[currentLang];
        let text = t.shareIntro + "\n\n";
        if(currentTab === 'monthly') {
            const stats = calculerBudget();
            text += `${t.totalIncome} : ${stats.totalRev.toFixed(2)} ${currentCurrency}\n`;
            text += `${t.totalExpense} : ${stats.totalDep.toFixed(2)} ${currentCurrency}\n`;
            text += `------------------\n`;
            text += `${t.resultText} ${stats.reste.toFixed(2)} ${currentCurrency}`;
        } else if (currentTab === 'goal') {
            text += `Goal: ${document.getElementById('goal-bar').innerText}`;
        } else {
            text += `Group Total: ${document.getElementById('groupTotalDisplay').innerText}`;
        }
        if(navigator.share) navigator.share({title: "Budget", text: text}); else prompt("Copier le texte :", text);
    }

    function openSettings() { document.getElementById('settings-panel').style.display='block'; document.getElementById('history-panel').style.display='none'; }
    function openHistory() { document.getElementById('settings-panel').style.display='none'; document.getElementById('history-panel').style.display='block'; renderHistory(); }
    function closePanels() { document.getElementById('settings-panel').style.display='none'; document.getElementById('history-panel').style.display='none'; }

    function switchTab(name) {
        currentTab = name;
        document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('page-' + name).classList.add('active');
        document.getElementById('nav-' + name).classList.add('active');
        const t = TRANSLATIONS[currentLang];
        let title = t.appTitle, sub = t.appSubtitle;
        if(name === 'group') { title = t.appTitleGroup; sub = t.appSubtitleGroup; }
        if(name === 'goal') { title = t.appTitleGoal; sub = t.appSubtitleGoal; }
        document.getElementById('header-title').innerText = title;
        document.getElementById('header-subtitle').innerText = sub;
    }

    function renderHistory() {
        const listDiv = document.getElementById('history-list'); listDiv.innerHTML = '';
        const history = JSON.parse(localStorage.getItem('budget_history') || '[]');
        if(history.length === 0) document.getElementById('no-history-msg').style.display = 'block';
        else {
            document.getElementById('no-history-msg').style.display = 'none';
            history.slice().reverse().forEach((item, rIndex) => {
                const realIndex = history.length - 1 - rIndex;
                const div = document.createElement('div'); div.className = 'history-item';
                const cur = item.currency || currentCurrency;
                const color = item.balance >= 0 ? '#00b894' : '#ff7675';
                div.innerHTML = `<div class="history-info"><h4>${item.name}</h4><p>Total: ${parseFloat(item.balance).toFixed(2)}${cur}</p></div><div class="history-actions"><button class="btn-icon-hist btn-share-hist" onclick="shareHistoryItem(${realIndex})">📤</button><button class="btn-icon-hist btn-pdf-hist" onclick="printHistoryItem(${realIndex})">📄</button><button class="btn-icon-hist btn-del" onclick="deleteHistoryItem(${realIndex})">✕</button></div>`;
                listDiv.appendChild(div);
            });
        }
    }

    function deleteHistoryItem(index) { if(confirm("Supprimer ?")) { const h = JSON.parse(localStorage.getItem('budget_history')); h.splice(index, 1); localStorage.setItem('budget_history', JSON.stringify(h)); renderHistory(); } }
    function shareHistoryItem(index) { 
        const h = JSON.parse(localStorage.getItem('budget_history')); const item = h[index]; const cur = item.currency; 
        const text = `Archive: ${item.name}\nTotal: ${parseFloat(item.balance).toFixed(2)} ${cur}`;
        if(navigator.share) navigator.share({title: item.name, text: text}); else prompt("Copy:", text);
    }

    function exportData() {
        const allData = {};
        for(let key in localStorage) if(key.startsWith('data_') || key === 'mySettings' || key === 'budget_history' || key === 'group_people') allData[key] = JSON.parse(localStorage.getItem(key));
        const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData));
        const a = document.createElement('a'); a.href = str; a.download = "backup_budget.json"; a.click();
    }
    function triggerImport() { document.getElementById('import-file').click(); }
    function importData(input) { const f = input.files[0]; if(!f) return; const r = new FileReader(); r.onload = function(e) { try { const d = JSON.parse(e.target.result); for(let key in d) localStorage.setItem(key, JSON.stringify(d[key])); location.reload(); } catch(e) { alert("Erreur import"); } }; r.readAsText(f); }
    function clearGroup() { if(confirm("Effacer ?")) { localStorage.removeItem('data_groupe'); document.getElementById('liste-groupe').innerHTML = ''; calculerGroupe(); closePanels(); } }
    function resetSettingsOnly() { if(confirm("Reset paramètres ?")) { localStorage.removeItem('mySettings'); location.reload(); } }
</script>
</body>
</html>
